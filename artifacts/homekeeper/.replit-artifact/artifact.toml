kind = "mobile"
previewPath = "/"
title = "HomeKeeper"
description = "A calm household maintenance app for keeping track of appliances, purchase details, warranties, and upcoming upkeep. Store household asset records locally and manage them from an iPhone."
version = "1.0.0"
id = "artifacts/homekeeper"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21258

[services.development]
run = "pnpm --filter @workspace/homekeeper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/homekeeper", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/homekeeper", "run", "serve" ]

[services.env]
PORT = "21258"
BASE_PATH = "/"
